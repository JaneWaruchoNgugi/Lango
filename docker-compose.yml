version: "3.9"

# Local development only.
# The OCR service is an internal sidecar that the Firebase Cloud Function
# calls via OCR_SERVICE_URL. In production, deploy to Cloud Run (same region
# as the Cloud Functions: us-central1) and set OCR_SERVICE_URL to the Cloud
# Run service URL via `firebase functions:secrets:set OCR_SERVICE_URL`.

services:
  ocr:
    build:
      context: ./services/ocr
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      OCR_SERVICE_TOKEN: dev-token-change-in-prod
      OCR_DEMO_MODE: "false"
      LOG_LEVEL: DEBUG
      TESSERACT_TIMEOUT_SECONDS: "30"
      MAX_FILE_BYTES: "5242880"
    volumes:
      # Hot-reload source during development — not present in production image.
      - ./services/ocr/app:/app/app:ro
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8080
        --reload
        --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s
